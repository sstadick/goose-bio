# Toolchains for the benchmark ports that are not installed system-wide.
# Goose, rustc, and the C compiler come from PATH.
[workspace]
name = "goose-bio-bench"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "=1.2.0"
zig = "=0.17.0"

[tasks]
radix = { cmd = "python3 run_radix_sort_bench.py", description = "Compare radix sort ports; arguments pass through" }
biofast = { cmd = "python3 run_biofast_bench.py", description = "Compare biofast bedcov and fqcnt ports; arguments pass through" }
